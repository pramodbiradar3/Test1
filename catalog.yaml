apiVersion: foundation.myorg/v1
kind: ArtifactCatalog

artifacts:

  - name: foundations-persistence
    capability: persistence
    contract: artifacts/foundations-persistence/artifact-contract.yaml
    documentation: artifacts/foundations-persistence/README.md

  - name: foundations-kafka
    capability: messaging
    contract: artifacts/foundations-kafka/artifact-contract.yaml
    documentation: artifacts/foundations-kafka/README.md

  - name: foundations-logging
    capability: logging
    contract: artifacts/foundations-logging/artifact-contract.yaml
    documentation: artifacts/foundations-logging/README.md

  - name: foundations-audit
    capability: audit
    contract: artifacts/foundations-audit/artifact-contract.yaml
    documentation: artifacts/foundations-audit/README.md
